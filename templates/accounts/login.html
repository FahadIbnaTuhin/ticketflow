<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | TicketFlow</title>
  </head>
  <body>
    <main>
      <h1>Log in</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <button type="submit">Log in</button>
      </form>
      <p><a href="{% url 'accounts:register' %}">Create an account</a></p>
    </main>
  </body>
</html>
