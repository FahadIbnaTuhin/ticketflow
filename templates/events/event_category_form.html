<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit category | {{ event.name }}</title>
  </head>
  <body>
    <main>
      <h1>Edit {{ category.name }}</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save category</button>
      </form>
      <p><a href="{% url 'events:category-list' event.pk %}">Back to categories</a></p>
    </main>
  </body>
</html>
