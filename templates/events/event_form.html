<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }} | TicketFlow</title>
  </head>
  <body>
    <main>
      <h1>{{ page_title }}</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save event</button>
      </form>
      <p><a href="{% url 'events:organizer-list' %}">Cancel</a></p>
    </main>
  </body>
</html>
